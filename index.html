    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "I have an idea but no technical team. Can you build it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — that is one of the two ways a project starts here. You describe the product; scope, data model, architecture, build and release are handled as a freelance engagement rather than a hire. The first release is built as the first increment of the real system, so it survives if the idea works."
            }
          },
          {
            "@type": "Question",
            "name": "Is Trimugo an AI company?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The core is product engineering — the web and mobile applications a business runs on, and the automation and integration around them. AI agents, retrieval and document extraction are things we build when a project genuinely calls for one, and we will say so plainly when it does not. One of the two systems written up on this page contains no AI at all, and it was the right call."
            }
          },
          {
            "@type": "Question",
            "name": "Can you work with our existing software?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Most of what we build joins an existing estate rather than replacing it — we integrate with the systems you already run and only replace what is genuinely holding the process back."
            }
          },
          {
            "@type": "Question",
            "name": "Can you integrate with our CRM or ERP?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, where the system exposes an API, a database connection or a supported export. We scope the integration surface during discovery so the constraints are known before the build starts."
            }
          },
          {
            "@type": "Question",
            "name": "Can you work alongside our internal development team?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We work as an engineering partner inside your process — your repositories, your review standards, your release cadence — or take a scope end to end, whichever fits."
            }
          },
          {
            "@type": "Question",
            "name": "Who actually does the work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Malisetti Obulamurthy — the founder and engineer behind Trimugo. There is no team behind the name and no subcontracting: the person you scope the project with is the person who writes the code, ships the release and supports it afterwards."
            }
          },
          {
            "@type": "Question",
            "name": "What hours do you work, and how does that overlap with my team?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Four hours a day, scheduled inside your working day rather than at the edge of it. From India (IST) that block covers a full European day in CET/CEST, the US Eastern morning, and all of India and APAC; US Pacific works by arrangement. Stand-ups, reviews and calls run at your hours."
            }
          },
          {
            "@type": "Question",
            "name": "Do you build MVPs or production systems?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Both, but we build MVPs as the first increment of a production system rather than as a throwaway. The architecture is chosen so the prototype can survive if it succeeds."
            }
          },
          {
            "@type": "Question",
            "name": "Can you maintain the software after launch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Maintenance, monitoring and continued development after go-live are part of what we offer, on an ongoing arrangement."
            }
          },
          {
            "@type": "Question",
            "name": "How does an AI workflow project start?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "With a conversation about how the process runs today — who touches it, where it waits, and what the exceptions are. That is usually enough to identify whether AI, automation, integration or plain software is the right answer, and where the value actually sits."
            }
          },
          {
            "@type": "Question",
            "name": "Do you only work with European companies?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Engagements are remote and the client can be anywhere — Europe and the UK, the US, India or the wider APAC region. The only real constraint is a working-hours overlap, and the daily block is scheduled around your day. Delivery is structured around milestones, scheduled demos and written documentation, with direct access to the engineer doing the work."
            }
          }
        ]
      }
    </script>
